services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mobilite
      POSTGRES_PASSWORD: mobilite
      POSTGRES_DB: mobilite
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobilite"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://mobilite:mobilite@db:5432/mobilite
      JWT_SECRET: dev-secret-a-remplacer-en-production-0123456789
      NODE_ENV: development
      PORT: "3000"
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
